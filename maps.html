<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maps – Mycofall Wiki</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/main.js"></script>
</head>
<body data-page="maps">
  <site-header class="site-header"></site-header>

  <main>
    <h1>Maps</h1>
    <p class="intro">
      Mycofall currently features 3 maps, each with its own visual style and
      atmosphere.
    </p>

    <div class="map-block">
      <div class="map-body">
        <h2><img class="icon-img icon-portrait" src="icons/maps/tutorial-mood.png" alt="" loading="lazy" onerror="this.onerror=null;this.src='icons/_placeholder.png'">Tutorial</h2>
        <p>Learn the game mechanics of the game.</p>
      </div>
      <img class="map-overview" src="icons/maps/tutorial-map.png" alt="" loading="lazy" onerror="this.onerror=null;this.src='icons/_placeholder.png'">
    </div>

    <div class="map-block">
      <div class="map-body">
        <h2><img class="icon-img icon-portrait" src="icons/maps/map-1-mood.png" alt="" loading="lazy" onerror="this.onerror=null;this.src='icons/_placeholder.png'">Dark Forest</h2>
        <p>It's dark out there.</p>
      </div>
      <img class="map-overview" src="icons/maps/map-1-map.png" alt="" loading="lazy" onerror="this.onerror=null;this.src='icons/_placeholder.png'">
    </div>

    <div class="map-block">
      <div class="map-body">
        <h2><img class="icon-img icon-portrait" src="icons/maps/map-2-mood.png" alt="" loading="lazy" onerror="this.onerror=null;this.src='icons/_placeholder.png'">Rugged Desert (WIP)</h2>
        <p>What is that green stuff?</p>
      </div>
      <img class="map-overview" src="icons/maps/map-2-map.png" alt="" loading="lazy" onerror="this.onerror=null;this.src='icons/_placeholder.png'">
    </div>
  </main>

  <site-footer class="site-footer"></site-footer>
</body>
</html>
