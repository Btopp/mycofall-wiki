<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maps – Mycofall Wiki</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/wiki-i18n.js"></script>
  <script src="js/main.js" defer></script>
</head>
<body data-page="maps">
  <site-header class="site-header"></site-header>
  <main>
    <h1><span data-i18n="Codex:Map.title">Maps</span></h1>
    <p class="intro"><span data-i18n="Codex:Map.desc">The arenas where you fight. Each map has its own layout and challenges.</span></p>
    <div class="map-block">
      <div class="map-body">
        <h2><img class="icon-img icon-md" src="icons/maps/map-tutorial.png" alt="" loading="lazy" onerror="this.onerror=null;this.src='icons/placeholder.svg'"> <span data-i18n="Maps:mapTutorial.title">Tutorial</span></h2>
        <p><span data-i18n="Maps:mapTutorial.desc">Learn the game.</span></p>
        <img class="map-overview" src="icons/map-images/map-tutorial.png" alt="" loading="lazy" onerror="this.onerror=null;this.src='icons/placeholder.svg'">
      </div>
    </div>
    <div class="map-block">
      <div class="map-body">
        <h2><img class="icon-img icon-md" src="icons/maps/map-dark-forest.png" alt="" loading="lazy" onerror="this.onerror=null;this.src='icons/placeholder.svg'"> <span data-i18n="Maps:mapDarkForest.title">Dark Forest</span></h2>
        <p><span data-i18n="Maps:mapDarkForest.desc">It's dark out there.</span></p>
        <img class="map-overview" src="icons/map-images/map-dark-forest.png" alt="" loading="lazy" onerror="this.onerror=null;this.src='icons/placeholder.svg'">
      </div>
    </div>
    <div class="map-block">
      <div class="map-body">
        <h2><img class="icon-img icon-md" src="icons/maps/map-rugged-desert.png" alt="" loading="lazy" onerror="this.onerror=null;this.src='icons/placeholder.svg'"> <span data-i18n="Maps:mapRuggedDesert.title">Rugged Desert</span></h2>
        <p><span data-i18n="Maps:mapRuggedDesert.desc">What is that green stuff?</span></p>
        <img class="map-overview" src="icons/map-images/map-rugged-desert.png" alt="" loading="lazy" onerror="this.onerror=null;this.src='icons/placeholder.svg'">
      </div>
    </div>
  </main>
  <site-footer class="site-footer"></site-footer>
</body>
</html>
